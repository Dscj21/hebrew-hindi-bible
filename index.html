<header id="top" class="appbar">
  <button id="title" class="title" aria-label="पुस्तक, अध्याय और पद चुनें"><span id="titleTxt">उत्पत्ति 1:1</span></button>
  <div class="acts">
    <button id="btnLex" class="ib alpha" aria-label="शब्दकोश (स्ट्रॉन्ग)">α</button>
    <button id="btnSearch" class="ib" aria-label="खोजें"><svg><use href="#i-search"/></svg></button>
    <button id="btnMenu" class="ib" aria-label="और विकल्प"><svg><use href="#i-more"/></svg></button>
  </div>
</header>
<div id="pull" aria-hidden="true"><span>↓ पुस्तक / अध्याय चुनें</span></div>

<main id="views">
  <section id="v-home" class="view" hidden></section>
  <section id="v-read" class="view" hidden>
    <div id="page"><p class="loading">लोड हो रहा है…</p></div>
  </section>
  <section id="v-search" class="view" hidden>
    <div class="sbox"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="शब्द, स्ट्रॉन्ग (H430) या संदर्भ (उत्पत्ति 37:35)" autocomplete="off" enterkeyhint="search"></div>
    <div class="seg" id="smode"><button data-m="all" class="on">सब</button><button data-m="ref">संदर्भ</button><button data-m="word">शब्द</button><button data-m="strong">स्ट्रॉन्ग</button></div>
    <div id="sres"></div>
  </section>
  <section id="v-saved" class="view" hidden>
    <div class="seg" id="svmode"><button data-m="fav" class="on">पसंदीदा</button><button data-m="bm">बुकमार्क</button><button data-m="hist">इतिहास</button></div>
    <div id="svlist"></div>
  </section>
  <section id="v-settings" class="view" hidden></section>
</main>

  <button data-tab="saved"><svg><use href="#i-star"/></svg><span>सहेजे</span></button>
  <button data-tab="settings"><svg><use href="#i-gear"/></svg><span>सेटिंग्स</span></button>
</nav>
